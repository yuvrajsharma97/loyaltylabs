<!DOCTYPE html>
<!--
  Throwaway dev tool - NOT part of the app. Only way to get a real Google ID
  token to test POST /auth/google without a frontend built yet.

  1. Put your OAuth Client ID below (the .apps.googleusercontent.com one).
  2. Serve this FOLDER (not the whole backend/) on http://localhost:5500:
       npx serve dev-tools -l 5500
     (Google Identity Services refuses to run from file:// - it needs a real
     http origin that matches an "Authorized JavaScript origin" in your
     Google Cloud OAuth client.)
  3. Open http://localhost:5500/google-login-test.html, click the button,
     sign in, copy the ID token that appears on the page.
  4. Test the backend:
       curl -X POST http://localhost:5000/api/v1/auth/google \
         -H "Content-Type: application/json" \
         -d "{\"idToken\":\"PASTE_TOKEN_HERE\"}"
-->
<html>
  <head>
    <meta charset="utf-8" />
    <title>LoyaltyLabs - Google login test</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body style="font-family: sans-serif; max-width: 600px; margin: 48px auto;">
    <h2>Google login test</h2>
    <p>Client ID currently set below - edit the <code>data-client_id</code> attribute if you change it.</p>

    <div id="g_id_onload"
         data-client_id="REPLACE_WITH_YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
         data-callback="handleCredentialResponse">
    </div>
    <div class="g_id_signin" data-type="standard"></div>

    <h3>ID token (paste this into your curl/Postman request):</h3>
    <textarea id="token-output" rows="10" style="width: 100%; font-family: monospace;" readonly></textarea>

    <script>
      function handleCredentialResponse(response) {
        document.getElementById('token-output').value = response.credential;
        console.log('ID token:', response.credential);
      }
    </script>
  </body>
</html>
